[project]
name = "gamepulse"
version = "0.1.0"
description = "Steam data collectors for the GamePulse PoC"
authors = [
    { name = "Veticus5", email = "maciej.wasiatycz@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
gamepulse = "gamepulse.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
